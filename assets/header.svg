.draw{stroke-dasharray:420;animation:draw 5.6s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:420}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

