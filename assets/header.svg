<filter id="haze" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="54"/></filter>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0v48" fill="none" stroke="#26f7c7" stroke-opacity=".06"/></pattern>
<linearGradient id="edge" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#26f7c7" stop-opacity=".85"/><stop offset=".45" stop-color="#7c5cff" stop-opacity=".45"/><stop offset="1" stop-color="#26f7c7" stop-opacity=".12"/></linearGradient>
<linearGradient id="scan" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#26f7c7" stop-opacity="0"/><stop offset=".5" stop-color="#26f7c7" stop-opacity=".5"/><stop offset="1" stop-color="#26f7c7" stop-opacity="0"/></linearGradient>
<linearGradient id="floor" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0b0f14" stop-opacity="0"/><stop offset="1" stop-color="#0b0f14"/></linearGradient>
<path id="wire" d="M912 118h118v54h-74v56h150" fill="none"/>
</defs>
<style>
.m{font-family:"Fira Code","JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
