    <ellipse cx="1010" cy="290" rx="260" ry="150" fill="#7c5cff" fill-opacity=".24"><animateTransform attributeName="transform" type="translate" values="0 0;-80 -30;50 14;0 0" dur="23s" repeatCount="indefinite"/></ellipse>
