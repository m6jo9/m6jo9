name: activity graph

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: activity-graph
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the renderer
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render the telemetry card
        run: node scripts/render-stats.mjs "${{ github.repository_owner }}" public/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Play pacman over the contribution grid
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Collect the rendered frames
        run: |
          mkdir -p public
          ls -la dist || true
          cp -f dist/pacman-contribution-graph*.svg public/
          ls -la public
          test -s public/stats.svg
          test -s public/pacman-contribution-graph.svg
          test -s public/pacman-contribution-graph-dark.svg

      - name: Publish them to the output branch
        run: |
          cd public
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "chore(activity): rerender from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
