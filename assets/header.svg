<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="m6jo9 - platform engineering and defensive security">
<title>m6jo9 - platform engineering / defensive security</title>
