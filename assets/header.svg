    <circle r="4" fill="#26f7c7" stroke="none"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1"><mpath href="#wire" xlink:href="#wire"/></animateMotion></circle>
    <path class="draw" d="M912 92l26 0 14-22 18 44 16-30 20 18 18-40 22 34 16-12 20 8 26 0" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
